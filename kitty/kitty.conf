# Mirrors ~/dotfiles/alacritty/alacritty.toml: same font, colours, tmux shell
# and key bindings. kitty's own shortcuts (tabs, splits, ctrl+shift+…) are all
# cleared so every other key reaches tmux and nvim untouched, as in Alacritty.

# Font
font_family      JetBrainsMono Nerd Font
font_size        10
# Alacritty font.offset.y = 1: one extra pixel of line height.
modify_font      cell_height +1px

# Window
hide_window_decorations yes
window_padding_width    1
remember_window_size    no
background_opacity      1
confirm_os_window_close 0
enable_audio_bell       no
cursor_blink_interval   0
scrollback_lines        5000

# Shell: attach to tmux (or start it), like Alacritty's terminal.shell.
shell              /bin/zsh -i -c "tmux attach || tmux -f ~/.config/tmux/tmux.conf"
term               xterm-256color
shell_integration  disabled
update_check_interval 0

# Colours (Alacritty's palette)
foreground #C6CCD6
background #0F1115
# "none" = reverse video, Alacritty's default cursor and selection look.
cursor               none
selection_foreground none
selection_background none

color0  #232830
color1  #CC6A6A
color2  #85B26F
color3  #D08442
color4  #6F9FD0
color5  #A78BD0
color6  #6CB6A4
color7  #C6CCD6
color8  #646C78
color9  #CC6A6A
color10 #85B26F
color11 #D08442
color12 #6F9FD0
color13 #A78BD0
color14 #6CB6A4
color15 #ECEFF4

# Key bindings: only Alacritty's.
clear_all_shortcuts yes

map ctrl+shift+c   copy_to_clipboard
map ctrl+shift+v   paste_from_clipboard
map shift+insert   paste_from_selection
map XF86Copy       copy_to_clipboard
map XF86Paste      paste_from_clipboard

map ctrl+0         change_font_size all 0
map ctrl+equal     change_font_size all +1
map ctrl+plus      change_font_size all +1
map ctrl+minus     change_font_size all -1

map f11            toggle_fullscreen

map shift+home     scroll_home
map shift+end      scroll_end

# Pass Ctrl+Tab / Ctrl+Shift+Tab through to tmux as Tab / Backtab.
map ctrl+tab       send_text all \t
map ctrl+shift+tab send_text all \x1b[Z
