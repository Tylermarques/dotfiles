# OBS Virtual Camera device, created at boot instead of by OBS at runtime.
# exclusive_caps=0 keeps the device advertising video capture even before OBS
# feeds it, so udev/PipeWire/WirePlumber see a camera from boot and Firefox's
# PipeWire camera portal lists it without a WirePlumber restart.
# video_nr and card_label match what OBS would create, so OBS reuses this device.
options v4l2loopback devices=1 video_nr=10 card_label="OBS Virtual Camera" exclusive_caps=0
