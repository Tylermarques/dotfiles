general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session    # lock before suspend
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })' && /home/tyler/dotfiles/hypr/scripts/dim_displays.sh brighten
}

# Dim displays 15 seconds before locking
listener {
    timeout = 285
    on-timeout = /home/tyler/dotfiles/hypr/scripts/dim_displays.sh dim
    on-resume = /home/tyler/dotfiles/hypr/scripts/dim_displays.sh brighten
}

# Lock the screen
listener {
    timeout = 300
    on-timeout = /home/tyler/dotfiles/hypr/scripts/idle_mute.sh mute; pidof hyprlock || hyprlock
    on-resume = /home/tyler/dotfiles/hypr/scripts/idle_mute.sh unmute
}

# Turn off screen
listener {
    timeout = 450
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })' && sleep 5 && /home/tyler/dotfiles/hypr/scripts/dim_displays.sh brighten
}
