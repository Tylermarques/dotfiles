source=~/.cache/quickshell/material/colors-hyprland.conf

# BACKGROUND
# One background block per monitor, generated by ~/.config/hypr/scripts/artwall.py
# (the current painting, framed, without the caption; the caption is a label below).
source = ~/.cache/artwall/hyprlock.conf

# GENERAL
# Disable the unlock fade-out: it completes on frame callbacks, which Hyprland does not
# deliver while DPMS is off, so hyprlock could hang after a correct password showing black.
animation = fadeOut, 0

# INPUT FIELD
input-field {
    monitor =
    size = 300, 40
    outline_thickness = 2
    dots_size = 0.2 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.2 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    outer_color = $surface
    inner_color = $surface
    font_color = $onSurface
    fade_on_empty = false
    placeholder_text =
    hide_input = false
    position = 0, 150
    halign = center
    valign = bottom
}

# Hour-Time
label {
    monitor =
    text = cmd[update:1000] echo -e "$(date +"%H")"
    color = $primary
    font_family = JetBrainsMono Bold
    font_size = 180
    position = 0, 150
    halign = center
    valign = center
}

# Minute-Time
label {
    monitor =
    text = cmd[update:1000] echo -e "$(date +"%M")"
    color = $onSurface
    font_family = JetBrainsMono Bold
    font_size = 180
    position = 0, -75
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:1000] echo -e "$(date +"%a, %b %d")"
    color = $onSurface
    font_family = JetBrainsMono Bold
    position = 100, -100
    halign = left
    valign = top
}

# Date
label {
    monitor =
    text = cmd[update:1000] primaryHex=$primaryHex bash ~/.config/hypr/scripts/hyprlock-time.sh
    color = $onSurface
    font_family = JetBrainsMono Bold
    position = 100, -130
    halign = left
    valign = top
}

# Artwork caption (title / artist, date), bottom right
label {
    monitor =
    text = cmd[update:30000] cat ~/.cache/artwall/caption.txt
    color = $onSurface
    font_family = Cormorant Garamond
    font_size = 26
    text_align = right
    position = -80, 80
    halign = right
    valign = bottom
}
